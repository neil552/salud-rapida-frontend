<main class="register-page">
  <section class="register-panel">
    <p class="eyebrow">Nuevo paciente</p>
    <h1>Crea tu cuenta</h1>
    <p class="intro">Regístrate para reservar y consultar tus citas médicas.</p>

    <form [formGroup]="registerForm" (ngSubmit)="registrar()" novalidate>
      <label>
        Nombre completo
        <input type="text" formControlName="nombre" autocomplete="name" [class.invalid]="campoInvalido('nombre')" />
        @if (campoInvalido('nombre')) { <span class="error">Ingresa al menos 3 caracteres.</span> }
      </label>
      <label>
        Correo electrónico
        <input type="email" formControlName="email" autocomplete="email" [class.invalid]="campoInvalido('email')" />
        @if (campoInvalido('email')) { <span class="error">Ingresa un correo válido.</span> }
      </label>
      <label>
        Contraseña
        <input type="password" formControlName="password" autocomplete="new-password" [class.invalid]="campoInvalido('password')" />
        @if (campoInvalido('password')) { <span class="error">Usa al menos 8 caracteres.</span> }
      </label>
      <label>
        Confirmar contraseña
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" [class.invalid]="campoInvalido('confirmPassword')" />
        @if (campoInvalido('confirmPassword')) { <span class="error">Confirma tu contraseña.</span> }
      </label>
      @if (error()) { <p class="register-error" role="alert">{{ error() }}</p> }
      <button type="submit">Crear cuenta de paciente</button>
    </form>
    <p class="login-link">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
