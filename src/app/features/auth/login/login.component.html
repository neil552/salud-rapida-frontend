<main class="login-page">
  <!-- Panel de autenticación y acceso a las credenciales de demostración. -->
  <section class="login-panel">
    <p class="eyebrow">Portal Salud Rápida</p>
    <h1>Ingresa a tu cuenta</h1>
    <p class="intro">Accede a tu espacio para gestionar citas y atención médica.</p>

    <!-- El formulario delega la validación y el envío al componente. -->
    <form [formGroup]="loginForm" (ngSubmit)="ingresar()" novalidate>
      <label>
        Correo electrónico
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.invalid]="campoInvalido('email')"
        />
        @if (campoInvalido('email')) {
          <span class="error">Ingresa un correo válido.</span>
        }
      </label>
      <label>
        Contraseña
        <span class="password-field"
          ><input
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [class.invalid]="campoInvalido('password')"
          /><button
            type="button"
            class="password-toggle"
            (click)="mostrarPassword.update((visible) => !visible)"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
          </button></span
        >
        @if (campoInvalido('password')) {
          <span class="error">Ingresa una contraseña de al menos 8 caracteres.</span>
        }
      </label>
      @if (error()) {
        <p class="login-error" role="alert">{{ error() }}</p>
      }
      <button type="submit">Ingresar al portal</button>
    </form>
    <p class="register-link">¿Eres paciente nuevo? <a routerLink="/registro">Crea tu cuenta</a></p>
    <p class="demo-note">
      Modo demostración: usa las credenciales entregadas para el perfil correspondiente.
    </p>
  </section>
</main>
